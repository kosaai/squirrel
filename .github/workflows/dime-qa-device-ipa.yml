name: Build final Dime QA unsigned device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - dime-full-migration
    paths:
      - .github/workflows/dime-qa-device-ipa.yml

permissions:
  contents: read

jobs:
  device-ipa:
    name: Preflight and build final Dime QA iPhone IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      QA_BUNDLE_ID: dev.squirrelapp.squirrel.dimeqa
      QA_WIDGET_BUNDLE_ID: dev.squirrelapp.squirrel.dimeqa.squirrelWidget

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify macOS 26 and select compatible Xcode
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dime-device-logs"
          sw_vers | tee "$RUNNER_TEMP/dime-device-logs/macos-version.log"
          sw_vers -productVersion | grep -Eq '^26([.]|$)'
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Xcode 26.6 not found; checking for another installed Xcode 26.x." >&2
            candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
            test -n "$candidate" || { echo "No compatible Xcode 26 installation available." >&2; exit 1; }
            export DEVELOPER_DIR="$candidate/Contents/Developer"
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/dime-device-logs/xcode-version.log"
          xcodebuild -version | grep -Eq '^Xcode 26[.]'
          xcrun --sdk iphoneos --show-sdk-path | tee "$RUNNER_TEMP/dime-device-logs/iphoneos-sdk.log"
          xcrun --sdk iphoneos --find clang | tee "$RUNNER_TEMP/dime-device-logs/iphoneos-clang.log"
      - name: Preflight QA project, assets, configuration and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f6c888d7244f4760cb9df48ae301b3bc3b1d3fe6 HEAD
          test -f Squirrel.xcodeproj/project.pbxproj
          plutil -lint Squirrel.xcodeproj/project.pbxproj
          test -f financecontrol/financecontrol.qa.entitlements
          plutil -lint financecontrol/financecontrol.qa.entitlements
          test -f financecontrol/Localizable.xcstrings
          python3 -m json.tool financecontrol/Localizable.xcstrings >/dev/null
          test -f financecontrol/View/ContentView.swift
          test -f financecontrol/View/DimeShell/Views/DimeHomeView.swift
          test -f financecontrol/View/DimeSettings/Views/DimeSettingsView.swift
          test -f financecontrol/View/Home/Views/DimeLog/DimeLogFilters.swift
          grep -q '#if DIME_QA' financecontrol/View/ContentView.swift
          grep -q 'DimeQARoot' financecontrol/View/ContentView.swift
          grep -q 'group.dev.squirrelapp.squirrel.dimeqa' financecontrol/financecontrol.qa.entitlements
          xcodebuild -list -project Squirrel.xcodeproj | tee "$RUNNER_TEMP/dime-device-logs/project-schemes.log"
          grep -q 'Squirrel_Release' "$RUNNER_TEMP/dime-device-logs/project-schemes.log"
          echo "All preflight checks passed."
      - name: Resolve dependencies
        run: |
          set -o pipefail
          rm -f Squirrel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies \
            -project Squirrel.xcodeproj \
            -scheme Squirrel_Release \
            -derivedDataPath "$RUNNER_TEMP/DimeQADeviceDerivedData" \
            | tee "$RUNNER_TEMP/dime-device-logs/spm-resolve.log"
      - name: Build Dime QA for iPhoneOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Squirrel.xcodeproj \
            -scheme Squirrel_Release \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DimeQADeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS=financecontrol/financecontrol.qa.entitlements \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DIME_QA' \
            | tee "$RUNNER_TEMP/dime-device-logs/xcodebuild-iphoneos.log"
      - name: Assign Dime QA package identities
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DimeQADeviceDerivedData/Build/Products/Release-iphoneos/Squirrel.app"
          test -d "$app_path"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $QA_BUNDLE_ID" "$app_path/Info.plist"
          extension_plist="$(find "$app_path/PlugIns" -name Info.plist -print -quit)"
          test -n "$extension_plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $QA_WIDGET_BUNDLE_ID" "$extension_plist"
      - name: Verify device build and Dime QA contents
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f6c888d7244f4760cb9df48ae301b3bc3b1d3fe6 HEAD
          app_path="$RUNNER_TEMP/DimeQADeviceDerivedData/Build/Products/Release-iphoneos/Squirrel.app"
          binary="$app_path/Squirrel"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "$QA_BUNDLE_ID"
          test "$(find "$app_path/PlugIns" -name Info.plist -exec /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' {} \;)" = "$QA_WIDGET_BUNDLE_ID"
          test -f "$binary"
          file "$binary" | tee "$RUNNER_TEMP/dime-device-logs/macho-file.log"
          file "$binary" | grep -E 'arm64|arm64e'
          otool -l "$binary" | grep -A 3 'LC_BUILD_VERSION' | tee "$RUNNER_TEMP/dime-device-logs/macho-platform.log"
          find "$app_path" -name 'DataContainer.momd' -print | tee "$RUNNER_TEMP/dime-device-logs/core-data-model.log"
          test -n "$(find "$app_path" -name 'DataContainer.momd' -print -quit)"
          find "$app_path" -path '*ar.lproj*' -print | tee "$RUNNER_TEMP/dime-device-logs/arabic-resources.log"
          test -n "$(find "$app_path" -path '*ar.lproj*' -print -quit)"
          grep -q '#if DIME_QA' financecontrol/View/ContentView.swift
          grep -q 'DimeHomeView' financecontrol/View/ContentView.swift
          grep -q 'DimeCustomTabBar' financecontrol/View/DimeShell/Views/DimeHomeView.swift
          grep -q 'DimeTransactionView' financecontrol/View/DimeShell/Views/DimeHomeView.swift
          grep -q 'CategoriesEditView' financecontrol/View/DimeSettings/Views/DimeSettingsView.swift
          grep -q 'self.savedSpendings = spendings' financecontrol/Data/CoreData/Entities/SpendingEntity/SpendingsModel.swift
          grep -q 'Restore Dime settings navigation' <(git log -1 --format=%B ec70dcd)
          grep -q 'group.dev.squirrelapp.squirrel.dimeqa' financecontrol/financecontrol.qa.entitlements
          if codesign -dvv "$app_path" >"$RUNNER_TEMP/dime-device-logs/codesign.log" 2>&1; then
            echo 'Expected an unsigned QA app, but a signature was found.' >&2
            exit 1
          fi
      - name: Package unsigned Dime QA IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DimeQADeviceDerivedData/Build/Products/Release-iphoneos/Squirrel.app"
          package_path="$RUNNER_TEMP/dime-qa-ipa/Payload"
          mkdir -p "$package_path"
          cp -R "$app_path" "$package_path/Nafaqat.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$package_path" \
            "$RUNNER_TEMP/Nafaqat-Dime-QA-Final-Unsigned.ipa"
          unzip -l "$RUNNER_TEMP/Nafaqat-Dime-QA-Final-Unsigned.ipa" | tee "$RUNNER_TEMP/dime-device-logs/ipa-contents.log"
          unzip -l "$RUNNER_TEMP/Nafaqat-Dime-QA-Final-Unsigned.ipa" | grep -q 'Payload/Nafaqat.app/Squirrel$'
          stat -f '%z bytes' "$RUNNER_TEMP/Nafaqat-Dime-QA-Final-Unsigned.ipa" | tee "$RUNNER_TEMP/dime-device-logs/ipa-size.log"
      - name: Upload unsigned Dime QA device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nafaqat-Dime-QA-Final-Unsigned-IPA
          path: ${{ runner.temp }}/Nafaqat-Dime-QA-Final-Unsigned.ipa
          if-no-files-found: error
      - name: Upload device IPA verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nafaqat-Dime-QA-device-verification
          path: ${{ runner.temp }}/dime-device-logs
          if-no-files-found: warn
